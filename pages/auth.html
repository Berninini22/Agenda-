<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Entrar | Agenda+</title>
  <meta name="description" content="Entre ou crie sua conta para utilizar o Agenda+.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
</head>
<body class="auth-page">
  <main class="auth-shell">
    <section class="auth-card" aria-labelledby="authTitle">
      <a class="auth-brand" href="../pages/auth.html" aria-label="Agenda+ — início">
        <span class="brand-mark" aria-hidden="true">+</span>
        <span class="brand-name">Agenda<span class="brand-plus">+</span></span>
      </a>
      <p class="eyebrow">Agendamento simples e acessível</p>
      <h1 id="authTitle">Entrar no Agenda+</h1>
      <p class="auth-subtitle" id="authSubtitle">Acesse sua conta para agendar e acompanhar suas consultas.</p>

      <form class="auth-form" id="authForm" novalidate>
        <div class="form-field" id="nameField" hidden>
          <label for="name">Nome completo</label>
          <input id="name" name="name" type="text" autocomplete="name" maxlength="120">
        </div>
        <div class="form-field">
          <label for="email">E-mail</label>
          <input id="email" name="email" type="email" autocomplete="email" required>
        </div>
        <div class="form-field">
          <label for="password">Senha</label>
          <input id="password" name="password" type="password" autocomplete="current-password" minlength="6" required>
          <span class="field-hint">Mínimo de 6 caracteres.</span>
        </div>
        <button class="btn btn-primary auth-submit" type="submit" id="authSubmit">Entrar</button>
        <p class="auth-error" id="authMessage" role="alert" aria-live="assertive"></p>
      </form>

      <p class="auth-switch" id="authSwitchText">Ainda não tem uma conta?
        <button type="button" class="link-button" id="toggleMode">Criar conta</button>
      </p>
      <a class="auth-back" href="../index.html">Voltar para o início</a>
    </section>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/supabase-config.js"></script>
  <script src="../js/auth.js"></script>
</body>
</html>
